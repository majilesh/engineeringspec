e roadmap must separate shipped capability from hypotheses, define measurable adoption outcomes, and defer broad vendor plugins or bidirectional architecture synchronization until evidence demonstrates value.","appliesTo":["TARGET-documentation"],"enforcement":"review"}],"contracts":[],"verification":[{"id":"VER-1","kind":"test","proves":["CON-1","CON-2","CON-3","CON-4","CON-5","CON-6","CON-7","CON-11"]},{"id":"VER-2","kind":"test","proves":["CON-12"]},{"id":"VER-3","kind":"human_review","proves":["CON-8","CON-9","CON-13"]},{"id":"VER-4","kind":"human_review","proves":["CON-10"]}]}],"diagnostics":[]}</script><script>const data=JSON.parse(document.getElementById('catalogue').textContent);const q=document.getElementById('q'),s=document.getElementById('status'),o=document.getElementById('owner'),r=document.getElementById('results'),summary=document.getElementById('summary'),stats=document.getElementById('stats');const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const statuses=[...new Set(data.entries.map(e=>e.status))].sort(),owners=[...new Set(data.entries.flatMap(e=>e.owners))].sort();statuses.forEach(v=>s.insertAdjacentHTML('beforeend','<option>'+esc(v)+'</option>'));owners.forEach(v=>o.insertAdjacentHTML('beforeend','<option>'+esc(v)+'</option>'));stats.innerHTML=[['Contracts',data.entries.length],['Approved',data.entries.filter(e=>e.status==='approved').length],['Targets',data.entries.reduce((n,e)=>n+e.targets.length,0)],['Obligations',data.entries.reduce((n,e)=>n+e.constraints.length,0)]].map(v=>'<div class="stat"><strong>'+v[1]+'</strong>'+v[0]+'</div>').join('');function render(){const needle=q.value.toLowerCase();const rows=data.entries.filter(e=>(!s.value||e.status===s.value)&&(!o.value||e.owners.includes(o.value))&&(!needle||JSON.stringify(e).toLowerCase().includes(needle)));summary.textContent=rows.length+' of '+data.entries.length+' contracts';r.innerHTML=rows.map(e=>'<article><h2>'+esc(e.title)+'</h2><p class="meta"><span>'+esc(e.id)+'</span><span>'+esc(e.status)+'</span><span>'+esc(e.owners.join(', ')||'unowned')+'</span></p><p class="paths">'+e.targets.flatMap(t=>t.paths).map(esc).join('<br>')+'</p><details><summary>Obligations</summary><ul>'+e.constraints.map(c=>'<li><strong>'+esc(c.id)+'</strong> '+esc(c.statement)+'</li>').join('')+'</ul></details></article>').join('')||'<p>No matching contracts.</p>'}q.addEventListener('input',render);s.addEventListener('change',render);o.addEventListener('change',render);render();</script></body></html>
