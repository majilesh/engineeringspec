name: Publish engineeringspec.org
on:
  push:
    branches: [main]
    paths: ["site/**", "schemas/**", "SPEC.md", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble immutable documentation
        run: |
          mkdir -p _site/schemas/0.1/profiles
          cp -R site/. _site/
          cp schemas/engineering-spec-0.1.schema.json _site/schemas/0.1/engineering-spec.schema.json
          cp schemas/implementation-receipt-0.1.schema.json _site/schemas/0.1/implementation-receipt.schema.json
          cp schemas/profiles/productspec-0.1.schema.json _site/schemas/0.1/profiles/productspec.schema.json
          cp SPEC.md _site/spec/0.1/SPEC.md
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: engineeringspec.org
          force_orphan: true
