name: CI
on:
  push:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:conformance
      - run: npm run build
      - run: node scripts/demo.mjs
      - run: npm pack --dry-run
      - name: Validate examples
        run: |
          node dist/cli.js validate examples/standalone/bug-fix.engineering-spec.md
          node dist/cli.js validate examples/infrastructure/infrastructure.engineering-spec.md
          node dist/cli.js validate examples/api-change/customer-api.engineering-spec.md
          node dist/cli.js validate examples/productspec/ticket-triage.engineering-spec.md
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
  engineering-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          path: docs/engineering-specs
          strict: true
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Gate smoke (pass + fail-closed + base-mode dogfood)
        run: |
          node dist/cli.js gate docs/engineering-specs/ES-gate-diff-scope.engineering-spec.md \
            --changed src/gate/gate.ts \
            --changed src/cli/program.ts \
            --format github
          if node dist/cli.js gate docs/engineering-specs/ES-gate-diff-scope.engineering-spec.md \
            --changed totally/unrelated.ts \
            --quiet; then
            echo "expected gate to fail for out-of-scope path" >&2
            exit 1
          fi
          if node dist/cli.js gate docs/engineering-specs/ES-gate-diff-scope.engineering-spec.md \
            --changed src/gate/gate.ts \
            --require-status approved \
            --quiet; then
            echo "expected gate to fail for draft status under --require-status approved" >&2
            exit 1
          fi
          # Always dogfood --spec-from base against an in-scope path (loads contract from HEAD as base).
          node dist/cli.js gate docs/engineering-specs/ES-gate-diff-scope.engineering-spec.md \
            --base HEAD \
            --spec-from base \
            --changed src/gate/gate.ts \
            --receipt gate-receipt.json \
            --quiet
          test -f gate-receipt.json
      - name: Gate PR / merge-group diff via Action inputs
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base_ref="${{ github.event.merge_group.base_ref }}"
            branch="${base_ref#refs/heads/}"
            git fetch origin "$branch"
            base="origin/$branch"
          fi
          echo "GATE_BASE=$base" >> "$GITHUB_ENV"
          diff_file="$(mktemp)"
          trap 'rm -f "$diff_file"' EXIT
          git diff --name-status -z --find-renames "$base"...HEAD > "$diff_file"
          changed_count=0
          gated=0
          contract_only=1
          classify_path() {
            local changed_path="$1"
            changed_count=$((changed_count + 1))
            case "$changed_path" in
              docs/engineering-specs/*|rfcs/*) ;;
              *) contract_only=0 ;;
            esac
            case "$changed_path" in
              src/*|test/*|action.yml|README.md|SPEC.md|CHANGELOG.md|package.json|package-lock.json|docs/*|schemas/*|conformance/*|.github/*) gated=1 ;;
            esac
          }
          while IFS= read -r -d '' change_status; do
            if ! IFS= read -r -d '' changed_path; then
              echo "Malformed NUL-delimited Git diff after status $change_status" >&2
              exit 1
            fi
            classify_path "$changed_path"
            case "$change_status" in
              R*|C*)
                if ! IFS= read -r -d '' changed_path; then
                  echo "Malformed NUL-delimited Git rename/copy record" >&2
                  exit 1
                fi
                classify_path "$changed_path"
                ;;
            esac
          done < "$diff_file"
          if [[ "$changed_count" -gt 0 && "$contract_only" -eq 1 ]]; then
            echo "CONTRACT_ONLY=1" >> "$GITHUB_ENV"
            echo "Contract-only governance diff: strict validation and repository checks remain required; implementation routing is not applicable."
          else
            echo "CONTRACT_ONLY=0" >> "$GITHUB_ENV"
          fi
          if [[ "$gated" -eq 1 ]]; then
            echo "GATE=1" >> "$GITHUB_ENV"
          else
            echo "GATE=0" >> "$GITHUB_ENV"
            echo "Skipping EngineeringSpec Action gate (PR does not touch gated paths)."
          fi
          # The approved base contract remains authoritative, including when this PR edits it.
          # Widen targets in a contract-only PR, merge it, then implement against that new base.
      - name: Run approved multi-spec routing
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && env.GATE == '1' && env.CONTRACT_ONLY != '1'
        uses: ./
        with:
          path: docs/engineering-specs
          strict: true
          gate-spec-dir: docs/engineering-specs
          gate-base: ${{ env.GATE_BASE }}
