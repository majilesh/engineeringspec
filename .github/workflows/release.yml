name: Publish npm release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run test:conformance && npm run build
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      # setup-node writes _authToken=${NODE_AUTH_TOKEN}; empty breaks publish with E404.
      # With npm Trusted Publishing + id-token, OIDC is used and the value is ignored,
      # but it must be non-empty. Optional secrets.NPM_TOKEN remains a token fallback.
      - name: Publish release candidate
        if: contains(github.ref_name, '-')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || 'oidc-trusted-publishing' }}
        run: npm publish --access public --tag next --provenance
      # Pre-1.0, every release is a candidate: keep `latest` on the newest one so a plain
      # `npx @engineeringspec/cli` is current. Trusted publishing can set only one tag per
      # publish, so this uses the repository NPM_TOKEN and fails loudly without it.
      - name: Promote latest to this release candidate
        if: contains(github.ref_name, '-')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required to move the latest dist-tag" >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          npm dist-tag add "@engineeringspec/cli@${version}" latest
          test "$(npm view @engineeringspec/cli dist-tags.latest)" = "$version"
      - name: Publish stable release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || 'oidc-trusted-publishing' }}
        run: npm publish --access public --provenance
