name: EngineeringSpec Validate
description: Validate EngineeringSpec documents, annotate pull requests, and optionally gate diffs against declared targets
author: EngineeringSpec contributors
branding:
  icon: check-circle
  color: blue
inputs:
  path:
    description: EngineeringSpec file or directory to validate
    required: false
    default: .
  strict:
    description: Treat warnings as failures
    required: false
    default: "false"
  strict-external:
    description: Fail when linked external sources cannot be resolved
    required: false
    default: "false"
  gate-spec:
    description: Optional EngineeringSpec file to gate against (enables fail-closed diff scope check)
    required: false
    default: ""
  gate-spec-dir:
    description: Optional base-pinned directory of approved EngineeringSpecs for deterministic multi-spec routing
    required: false
    default: ""
  gate-allow-contract-only:
    description: Allow strictly validated, specification-directory-only governance changes; requires gate-spec-dir
    required: false
    default: "false"
  gate-base:
    description: Git base ref for gate (e.g. origin/main). Required when gate-spec or gate-spec-dir is set. Use actions/checkout fetch-depth 0.
    required: false
    default: ""
  gate-head:
    description: Git head ref for gate
    required: false
    default: "HEAD"
  gate-spec-from:
    description: "Load gate contract from workspace or gate-base. Use base in enforcing CI to prevent PR self-widening."
    required: false
    default: "base"
  gate-require-status:
    description: Optional comma-separated statuses required for enforcing mode (e.g. approved)
    required: false
    default: ""
  gate-receipt:
    description: Optional path (relative to consumer workspace) to write unsigned gate-receipt.json
    required: false
    default: ""
  bootstrap-mode:
    description: "First-adoption advisory mode for gate-spec-dir. Honored only when the trusted base has no engineering-spec.json and no approved contracts; otherwise ignored."
    required: false
    default: ""
  contract:
    description: "Optional approved contract ID that narrows gate-spec-dir routing (never widens). On pull_request events, PR labels and the head branch are also passed and honored only when the trusted base configures selection prefixes; EngineeringSpec-Contract commit trailers are always read."
    required: false
    default: ""
outputs:
  result:
    description: "pass, fail, or error: the enforcement outcome of directory routing (gate-spec-dir only)"
    value: ${{ steps.gate.outputs.result }}
  mode:
    description: "legacy, advisory, standard, controlled, or bootstrap_advisory"
    value: ${{ steps.gate.outputs.mode }}
  classification:
    description: "none, contract_only, implementation, implementation_with_monotonic_close, or implementation_with_receipt"
    value: ${{ steps.gate.outputs.classification }}
  selected-contract:
    description: "The contract a selector narrowed routing to, if any"
    value: ${{ steps.gate.outputs.selected-contract }}
runs:
  using: composite
  steps:
    # The committed action/cli.mjs bundle is reviewed with the source; nothing is installed or compiled here.
    - name: Validate EngineeringSpec documents
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_STRICT_EXTERNAL: ${{ inputs.strict-external }}
      run: |
        set -euo pipefail
        args=()
        if [[ "$INPUT_STRICT" == "true" ]]; then args+=(--strict); fi
        if [[ "$INPUT_STRICT_EXTERNAL" == "true" ]]; then args+=(--strict-external); fi
        if [[ "$INPUT_PATH" = /* ]]; then
          target="$INPUT_PATH"
        else
          target="$GITHUB_WORKSPACE/$INPUT_PATH"
        fi
        node "$GITHUB_ACTION_PATH/action/cli.mjs" validate "$target" --format github "${args[@]}"
    - name: Gate diff against EngineeringSpec targets
      id: gate
      if: ${{ inputs.gate-spec != '' || inputs.gate-spec-dir != '' || inputs.gate-allow-contract-only != 'false' }}
      shell: bash
      env:
        INPUT_GATE_SPEC: ${{ inputs.gate-spec }}
        INPUT_GATE_SPEC_DIR: ${{ inputs.gate-spec-dir }}
        INPUT_GATE_ALLOW_CONTRACT_ONLY: ${{ inputs.gate-allow-contract-only }}
        INPUT_GATE_BASE: ${{ inputs.gate-base }}
        INPUT_GATE_HEAD: ${{ inputs.gate-head }}
        INPUT_GATE_SPEC_FROM: ${{ inputs.gate-spec-from }}
        INPUT_GATE_REQUIRE_STATUS: ${{ inputs.gate-require-status }}
        INPUT_GATE_RECEIPT: ${{ inputs.gate-receipt }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_BOOTSTRAP_MODE: ${{ inputs.bootstrap-mode }}
        INPUT_CONTRACT: ${{ inputs.contract }}
      run: |
        set -euo pipefail
        if [[ -n "$INPUT_GATE_SPEC" && -n "$INPUT_GATE_SPEC_DIR" ]]; then
          echo "gate-spec and gate-spec-dir are mutually exclusive" >&2
          exit 2
        fi
        if [[ "$INPUT_GATE_ALLOW_CONTRACT_ONLY" != "true" && "$INPUT_GATE_ALLOW_CONTRACT_ONLY" != "false" ]]; then
          echo "gate-allow-contract-only must be true or false" >&2
          exit 2
        fi
        if [[ "$INPUT_GATE_ALLOW_CONTRACT_ONLY" == "true" && -z "$INPUT_GATE_SPEC_DIR" ]]; then
          echo "gate-allow-contract-only requires gate-spec-dir and is incompatible with gate-spec" >&2
          exit 2
        fi
        if [[ -n "$INPUT_BOOTSTRAP_MODE" && "$INPUT_BOOTSTRAP_MODE" != "advisory" ]]; then
          echo "bootstrap-mode must be empty or advisory" >&2
          exit 2
        fi
        if [[ -z "$INPUT_GATE_BASE" ]]; then
          echo "gate-base is required when gate-spec or gate-spec-dir is set (example: origin/main)" >&2
          exit 2
        fi
        args=(--base "$INPUT_GATE_BASE" --head "$INPUT_GATE_HEAD")
        if [[ "$INPUT_STRICT" == "true" ]]; then args+=(--strict); fi
        if [[ -n "$INPUT_GATE_REQUIRE_STATUS" ]]; then
          IFS=',' read -r -a statuses <<< "$INPUT_GATE_REQUIRE_STATUS"
          for status in "${statuses[@]}"; do
            status="$(echo "$status" | xargs)"
            if [[ -n "$status" ]]; then
              args+=(--require-status "$status")
            fi
          done
        fi
        if [[ -n "$INPUT_GATE_SPEC_DIR" ]]; then
          if [[ -n "$INPUT_GATE_RECEIPT" ]]; then
            echo "gate-receipt is currently supported only with gate-spec" >&2
            exit 2
          fi
          if [[ "$INPUT_GATE_SPEC_DIR" = /* ]]; then
            echo "gate-spec-dir must be repository-relative" >&2
            exit 2
          fi
          cd "$GITHUB_WORKSPACE"
          if [[ "$INPUT_GATE_ALLOW_CONTRACT_ONLY" == "true" ]]; then args+=(--allow-contract-only); fi
          if [[ -n "$INPUT_BOOTSTRAP_MODE" ]]; then args+=(--bootstrap-mode "$INPUT_BOOTSTRAP_MODE"); fi
          selector_args=()
          if [[ -n "$INPUT_CONTRACT" ]]; then selector_args+=(--contract "$INPUT_CONTRACT"); fi
          # Labels and the head branch exist only on pull_request events; merge queues rely on commit trailers.
          if [[ "${GITHUB_EVENT_NAME:-}" == pull_request* && -n "${GITHUB_EVENT_PATH:-}" ]]; then
            if [[ -n "${GITHUB_HEAD_REF:-}" ]]; then selector_args+=(--selector-branch "$GITHUB_HEAD_REF"); fi
            while IFS= read -r -d '' label; do
              selector_args+=(--selector-label "$label")
            done < <(node -e 'const e=JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH,"utf8"));for(const l of e.pull_request?.labels??[])if(typeof l.name==="string")process.stdout.write(l.name+"\0")')
          fi
          if (( ${#selector_args[@]} )); then args+=("${selector_args[@]}"); fi
          set +e
          node "$GITHUB_ACTION_PATH/action/cli.mjs" select "$INPUT_GATE_SPEC_DIR" "${args[@]}" --format github
          select_status=$?
          set -e
          # Expose the outcome as step outputs; the JSON run repeats the same read-only decision.
          node "$GITHUB_ACTION_PATH/action/cli.mjs" select "$INPUT_GATE_SPEC_DIR" "${args[@]}" --format json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s);const e=r.enforcement??{};const out=[`result=${e.outcome??"error"}`,`mode=${e.mode??""}`,`classification=${r.governance?.classification??""}`,`selected-contract=${e.selectedContract??""}`].join("\n");require("fs").appendFileSync(process.env.GITHUB_OUTPUT,out+"\n");}catch{}})' || true
          if [[ "$select_status" -ne 0 ]]; then exit "$select_status"; fi
          normalized_status="$(echo "$INPUT_GATE_REQUIRE_STATUS" | tr -d '[:space:]')"
          if [[ -z "$normalized_status" || "$normalized_status" == "approved" ]]; then
            review_args=(--spec-dir "$INPUT_GATE_SPEC_DIR" --base "$INPUT_GATE_BASE" --head "$INPUT_GATE_HEAD" --no-worktree --format github)
            if [[ "$INPUT_STRICT" == "true" ]]; then review_args+=(--strict); fi
            if [[ "$INPUT_GATE_ALLOW_CONTRACT_ONLY" == "true" ]]; then review_args+=(--allow-contract-only); fi
            if [[ -n "$INPUT_BOOTSTRAP_MODE" ]]; then review_args+=(--bootstrap-mode "$INPUT_BOOTSTRAP_MODE"); fi
            if (( ${#selector_args[@]} )); then review_args+=("${selector_args[@]}"); fi
            node "$GITHUB_ACTION_PATH/action/cli.mjs" review "${review_args[@]}"
          else
            echo "::notice title=EngineeringSpec review::Detailed summary is available for the default approved-only policy; enforcement still completed for the requested statuses."
          fi
          exit 0
        fi
        if [[ "$INPUT_GATE_SPEC" = /* ]]; then
          spec="$INPUT_GATE_SPEC"
        else
          spec="$GITHUB_WORKSPACE/$INPUT_GATE_SPEC"
        fi
        args+=(--spec-from "$INPUT_GATE_SPEC_FROM")
        if [[ -n "$INPUT_GATE_RECEIPT" ]]; then
          if [[ "$INPUT_GATE_RECEIPT" = /* ]]; then
            receipt="$INPUT_GATE_RECEIPT"
          else
            receipt="$GITHUB_WORKSPACE/$INPUT_GATE_RECEIPT"
          fi
          mkdir -p "$(dirname "$receipt")"
          args+=(--receipt "$receipt")
        fi
        # Run from the consumer workspace so git diff sees their checkout.
        cd "$GITHUB_WORKSPACE"
        node "$GITHUB_ACTION_PATH/action/cli.mjs" gate "$spec" "${args[@]}" --format github
