name: EngineeringSpec Validate
description: Validate EngineeringSpec documents, annotate pull requests, and optionally gate diffs against declared targets
author: EngineeringSpec contributors
branding:
  icon: check-circle
  color: blue
inputs:
  path:
    description: EngineeringSpec file or directory to validate
    required: false
    default: .
  strict:
    description: Treat warnings as failures
    required: false
    default: "false"
  strict-external:
    description: Fail when linked external sources cannot be resolved
    required: false
    default: "false"
  gate-spec:
    description: Optional EngineeringSpec file to gate against (enables fail-closed diff scope check)
    required: false
    default: ""
  gate-spec-dir:
    description: Optional base-pinned directory of approved EngineeringSpecs for deterministic multi-spec routing
    required: false
    default: ""
  gate-allow-contract-only:
    description: Allow strictly validated, specification-directory-only governance changes; requires gate-spec-dir
    required: false
    default: "false"
  gate-base:
    description: Git base ref for gate (e.g. origin/main). Required when gate-spec or gate-spec-dir is set. Use actions/checkout fetch-depth 0.
    required: false
    default: ""
  gate-head:
    description: Git head ref for gate
    required: false
    default: "HEAD"
  gate-spec-from:
    description: "Load gate contract from workspace or gate-base. Use base in enforcing CI to prevent PR self-widening."
    required: false
    default: "base"
  gate-require-status:
    description: Optional comma-separated statuses required for enforcing mode (e.g. approved)
    required: false
    default: ""
  gate-receipt:
    description: Optional path (relative to consumer workspace) to write unsigned gate-receipt.json
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Prepare EngineeringSpec CLI
      shell: bash
      run: npm ci --ignore-scripts --prefix "$GITHUB_ACTION_PATH" && npm run build --prefix "$GITHUB_ACTION_PATH"
    - name: Validate EngineeringSpec documents
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_STRICT_EXTERNAL: ${{ inputs.strict-external }}
      run: |
        set -euo pipefail
        args=()
        if [[ "$INPUT_STRICT" == "true" ]]; then args+=(--strict); fi
        if [[ "$INPUT_STRICT_EXTERNAL" == "true" ]]; then args+=(--strict-external); fi
        if [[ "$INPUT_PATH" = /* ]]; then
          target="$INPUT_PATH"
        else
          target="$GITHUB_WORKSPACE/$INPUT_PATH"
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" validate "$target" --format github "${args[@]}"
    - name: Gate diff against EngineeringSpec targets
      if: ${{ inputs.gate-spec != '' || inputs.gate-spec-dir != '' || inputs.gate-allow-contract-only != 'false' }}
      shell: bash
      env:
        INPUT_GATE_SPEC: ${{ inputs.gate-spec }}
        INPUT_GATE_SPEC_DIR: ${{ inputs.gate-spec-dir }}
        INPUT_GATE_ALLOW_CONTRACT_ONLY: ${{ inputs.gate-allow-contract-only }}
        INPUT_GATE_BASE: ${{ inputs.gate-base }}
        INPUT_GATE_HEAD: ${{ inputs.gate-head }}
        INPUT_GATE_SPEC_FROM: ${{ inputs.gate-spec-from }}
        INPUT_GATE_REQUIRE_STATUS: ${{ inputs.gate-require-status }}
        INPUT_GATE_RECEIPT: ${{ inputs.gate-receipt }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        if [[ -n "$INPUT_GATE_SPEC" && -n "$INPUT_GATE_SPEC_DIR" ]]; then
          echo "gate-spec and gate-spec-dir are mutually exclusive" >&2
          exit 2
        fi
        if [[ "$INPUT_GATE_ALLOW_CONTRACT_ONLY" != "true" && "$INPUT_GATE_ALLOW_CONTRACT_ONLY" != "false" ]]; then
          echo "gate-allow-contract-only must be true or false" >&2
          exit 2
        fi
        if [[ "$INPUT_GATE_ALLOW_CONTRACT_ONLY" == "true" && -z "$INPUT_GATE_SPEC_DIR" ]]; then
          echo "gate-allow-contract-only requires gate-spec-dir and is incompatible with gate-spec" >&2
          exit 2
        fi
        if [[ -z "$INPUT_GATE_BASE" ]]; then
          echo "gate-base is required when gate-spec or gate-spec-dir is set (example: origin/main)" >&2
          exit 2
        fi
        args=(--base "$INPUT_GATE_BASE" --head "$INPUT_GATE_HEAD" --format github)
        if [[ "$INPUT_STRICT" == "true" ]]; then args+=(--strict); fi
        if [[ -n "$INPUT_GATE_REQUIRE_STATUS" ]]; then
          IFS=',' read -r -a statuses <<< "$INPUT_GATE_REQUIRE_STATUS"
          for status in "${statuses[@]}"; do
            status="$(echo "$status" | xargs)"
            if [[ -n "$status" ]]; then
              args+=(--require-status "$status")
            fi
          done
        fi
        if [[ -n "$INPUT_GATE_SPEC_DIR" ]]; then
          if [[ -n "$INPUT_GATE_RECEIPT" ]]; then
            echo "gate-receipt is currently supported only with gate-spec" >&2
            exit 2
          fi
          if [[ "$INPUT_GATE_SPEC_DIR" = /* ]]; then
            echo "gate-spec-dir must be repository-relative" >&2
            exit 2
          fi
          cd "$GITHUB_WORKSPACE"
          if [[ "$INPUT_GATE_ALLOW_CONTRACT_ONLY" == "true" ]]; then args+=(--allow-contract-only); fi
          node "$GITHUB_ACTION_PATH/dist/cli.js" select "$INPUT_GATE_SPEC_DIR" "${args[@]}"
          normalized_status="$(echo "$INPUT_GATE_REQUIRE_STATUS" | tr -d '[:space:]')"
          if [[ -z "$normalized_status" || "$normalized_status" == "approved" ]]; then
            review_args=(--spec-dir "$INPUT_GATE_SPEC_DIR" --base "$INPUT_GATE_BASE" --head "$INPUT_GATE_HEAD" --no-worktree --format github)
            if [[ "$INPUT_STRICT" == "true" ]]; then review_args+=(--strict); fi
            if [[ "$INPUT_GATE_ALLOW_CONTRACT_ONLY" == "true" ]]; then review_args+=(--allow-contract-only); fi
            node "$GITHUB_ACTION_PATH/dist/cli.js" review "${review_args[@]}"
          else
            echo "::notice title=EngineeringSpec review::Detailed summary is available for the default approved-only policy; enforcement still completed for the requested statuses."
          fi
          exit 0
        fi
        if [[ "$INPUT_GATE_SPEC" = /* ]]; then
          spec="$INPUT_GATE_SPEC"
        else
          spec="$GITHUB_WORKSPACE/$INPUT_GATE_SPEC"
        fi
        args+=(--spec-from "$INPUT_GATE_SPEC_FROM")
        if [[ -n "$INPUT_GATE_RECEIPT" ]]; then
          if [[ "$INPUT_GATE_RECEIPT" = /* ]]; then
            receipt="$INPUT_GATE_RECEIPT"
          else
            receipt="$GITHUB_WORKSPACE/$INPUT_GATE_RECEIPT"
          fi
          mkdir -p "$(dirname "$receipt")"
          args+=(--receipt "$receipt")
        fi
        # Run from the consumer workspace so git diff sees their checkout.
        cd "$GITHUB_WORKSPACE"
        node "$GITHUB_ACTION_PATH/dist/cli.js" gate "$spec" "${args[@]}"
